
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金科一甲象棋｜完整版</title>
<style>
:root {
  --wood: #e8bd70;
  --wood-light: #f8dfa0;
  --ink: #6c421d;
  --paper: #fffaf0;
  --red: #d52b2b;
  --black: #292521;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 10px 34px;
  text-align: center;
  font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
  color: #f8e5b5;
  background: radial-gradient(
    ellipse at 50% 0%,
    #6b421f 0%,
    #2a180d 75%,
    #170e08 100%
  );
  min-height: 100vh;
}

h1 {
  font-size: clamp(25px, 5vw, 36px);
  margin: 8px 0 5px;
  letter-spacing: 4px;
  color: #f9d77f;
  text-shadow: 0 2px #321706, 0 0 14px #d9a64b;
}

.subtitle {
  color: #e4c18a;
  font-size: 13px;
  margin-bottom: 16px;
  letter-spacing: 1px;
}

.panel,
.history {
  width: min(96vw, 760px);
  margin: 0 auto 14px;
  background: linear-gradient(145deg, #29180d, #120d08 70%, #34200f);
  border: 2px solid #9c6a2b;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 10px 28px #0008, inset 0 0 0 1px #f4d28b35;
  color: #f8e9c9;
}

.mode {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  font-weight: 700;
  color: #f7e5c2;
}

.mode label {
  cursor: pointer;
}

#status {
  font-size: 19px;
  font-weight: 800;
  margin: 8px;
  color: #ffe0a0;
}

.board-wrap {
  width: min(94vw, 620px);
  margin: 0 auto;
  padding: 10px;
  background: linear-gradient(
    135deg,
    #5a3215,
    #e8b85b 15%,
    #f9dc8b 35%,
    #b77a2d 65%,
    #f0c66e 85%,
    #5a3215
  );
  border: 5px solid #6b3a12;
  box-shadow: 0 14px 34px #0009,
    inset 0 0 0 2px #ffe6a0,
    inset 0 0 0 5px #9d6525;
  border-radius: 12px;
}

/* 9 條直線、10 條橫線，形成 90 個交叉點 */
#board {
  position: relative;
  width: 100%;
  aspect-ratio: 8 / 9;
  background-color: #efc66e;
  background-image:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(12.5% - 1px),
      #70471f calc(12.5% - 1px),
      #70471f 12.5%
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(11.111111% - 1px),
      #70471f calc(11.111111% - 1px),
      #70471f 11.111111%
    ),
    repeating-linear-gradient(
      90deg,
      #9c652110 0,
      #9c652110 1px,
      transparent 1px,
      transparent 5px
    ),
    linear-gradient(90deg, #e9b958, #f9db8a 48%, #e8b958);
  border: 2px solid #71451e;
  overflow: visible;
  isolation: isolate;
}

.cell {
  position: absolute;
  left: 0;
  top: 0;
  width: 12.5%;
  height: 11.111%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 3;
}

/* 楚河漢界 */
.river-text {
  position: absolute;
  z-index: 2;
  top: 44.444%;
  left: 0;
  width: 100%;
  height: 11.112%;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  color: #6b3c14;
  font-family: "DFKai-SB", "標楷體", serif;
  font-weight: bold;
  font-size: clamp(15px, 3.7vw, 24px);
  letter-spacing: 4px;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    #efc66ef2,
    #f7d989f7,
    #efc66ef2
  );
  text-shadow: 0 1px #fff4;
}

/* 九宮斜線 */
.palace {
  position: absolute;
  left: 37.5%;
  width: 25%;
  height: 22.222%;
  pointer-events: none;
  z-index: 1;
}

.palace.top {
  top: 0;
}

.palace.bottom {
  bottom: 0;
}

.palace line {
  stroke: #795027;
  stroke-width: 1.2;
}

/* 棋子：不透明背景覆蓋棋盤線 */
.piece {
  position: relative;
  z-index: 5;
  isolation: isolate;
  width: min(10vw, 56px);
  max-width: 92%;
  height: auto;
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "DFKai-SB", "標楷體", "KaiTi", serif;
  font-size: clamp(17px, 4.1vw, 31px);
  font-weight: bold;
  background: radial-gradient(
    circle at 30% 22%,
    #fffef7 0%,
    #fff9e7 48%,
    #f1dfb7 72%,
    #c8a66a 100%
  );
  background-color: #fff5dc;
  opacity: 1;
  border: 2px solid #9a6a2e;
  box-shadow:
    0 3px 0 #603813,
    0 6px 9px #321a0d80,
    inset 0 0 0 2px #fff9e9,
    inset 0 -4px 6px #a77a3c70;
  user-select: none;
  transition: transform .12s, box-shadow .12s;
}

.piece.red {
  color: #c51f1f;
  border-color: #b66b35;
  text-shadow: 0 1px #fff3;
}

.piece.black {
  color: #211b15;
  border-color: #9a6a2e;
}

.selected .piece {
  outline: 3px solid #46c8ff;
  outline-offset: 1px;
  transform: scale(1.06);
  z-index: 8;
}

.target:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 23%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #218b52;
  opacity: .95;
  z-index: 6;
  pointer-events: none;
  box-shadow: 0 0 0 2px #fff8;
}

.target.capture:after {
  width: min(10vw, 56px);
  background: #fff2;
  border: 3px dashed #d52e2e;
  z-index: 6;
}

.last-from .piece,
.last-to .piece {
  box-shadow:
    0 0 0 3px #f6c449,
    0 6px 9px #321a0d80,
    inset 0 0 0 2px #fff8;
}

#message {
  min-height: 24px;
  font-weight: 700;
  margin: 12px 0 4px;
  color: #ffe0a0;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin: 10px auto;
}

button,
select {
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  border: 1px solid #c28b3c;
  border-radius: 9px;
  padding: 10px 13px;
  background: linear-gradient(#6e451f, #301a0b);
  color: #fff1ce;
  cursor: pointer;
  box-shadow: 0 3px 7px #0006;
  transition: filter .15s, transform .15s;
}

button:hover {
  filter: brightness(1.3);
  transform: translateY(-1px);
}

button:disabled,
select:disabled {
  opacity: .55;
  cursor: wait;
}

.secondary {
  background: linear-gradient(#a17d51, #795735);
}

.meta {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 13px;
  color: #e3c28c;
  margin-top: 10px;
}

.history {
  line-height: 1.85;
  margin: 14px auto;
  white-space: pre-wrap;
  max-height: 200px;
  overflow: auto;
  font-size: 14px;
}

.history b {
  color: #ffe0a0;
}

.note {
  max-width: 640px;
  margin: 14px auto;
  font-size: 12px;
  line-height: 1.8;
  color: #e3c28c;
}

input[type="radio"] {
  accent-color: #e7b34f;
}

@media (min-width: 900px) {
  .piece {
    width: min(6vw, 60px);
  }
}

@media (max-width: 390px) {
  body {
    padding: 14px 5px 24px;
  }

  .board-wrap {
    padding: 6px;
    border-width: 4px;
  }

  .piece {
    width: 9.5vw;
    font-size: clamp(16px, 4.5vw, 23px);
    border-width: 1.5px;
  }

  .controls button {
    padding: 9px 10px;
  }

  .panel {
    padding: 10px;
  }
}
</style>
</head>
<body>

<h1>🏮 金科一甲象棋</h1>
<div class="subtitle">完整走棋判定・人機對弈・棋譜紀錄</div>

<div class="panel">
  <div class="mode">
    <label>
      <input type="radio" name="mode" value="ai" checked>
      單人對弈（紅方對電腦）
    </label>
    <label>
      <input type="radio" name="mode" value="pvp">
      雙人同屏
    </label>
  </div>

  <div id="status">紅方先行</div>

  <div class="board-wrap">
    <div id="board">
      <svg class="palace top" viewBox="0 0 90 90" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="90" y2="90"/>
        <line x1="90" y1="0" x2="0" y2="90"/>
      </svg>

      <svg class="palace bottom" viewBox="0 0 90 90" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="90" y2="90"/>
        <line x1="90" y1="0" x2="0" y2="90"/>
      </svg>

      <div class="river-text">
        <span>楚 河</span>
        <span>漢 界</span>
      </div>
    </div>
  </div>

  <div id="message">紅方先行，點擊棋子查看合法落點。</div>

  <div class="controls">
    <label>
      電腦難度
      <select id="difficulty">
        <option value="1">入門</option>
        <option value="2" selected>普通</option>
        <option value="3">困難</option>
        <option value="4">專家</option>
      </select>
    </label>

    <button id="restart">重新開始</button>
    <button id="undo">悔棋</button>
    <button id="hint">提示棋步</button>
    <button id="flip" class="secondary">翻轉棋盤</button>
    <button id="export" class="secondary">匯出棋譜</button>
  </div>

  <div class="meta">
    <span id="move-count">回合：0</span>
    <span id="think-info">AI：待命</span>
    <span id="check-info">局面：正常</span>
  </div>
</div>

<div class="history" id="history">
  <b>棋譜</b><br>尚未開始
</div>

<div class="note">
  支援車、馬、炮、相／象、仕／士、帥／將、兵／卒的基本合法走法，
  包含馬腿、象眼、炮架、過河、九宮、將帥照面與不得讓己方將帥受攻擊。
  棋譜採傳統記譜方式，包含將軍、將死、困斃、三次重複局面及連續
  120 半回合未吃子和棋判定。長將、長捉等正式競賽裁判規則較複雜，
  本程式以一般休閒對弈規則處理。
</div>

<script>
