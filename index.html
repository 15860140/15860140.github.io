
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中國象棋｜人機對弈</title>

<style>
:root {
  --wood: #c58b48;
  --wood2: #e9c88b;
  --ink: #59371c;
  --red: #b82424;
  --black: #24201c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 12px 36px;
  text-align: center;
  font-family: "KaiTi", "標楷體",
    "Microsoft JhengHei", serif;
  color: #3e2919;
  background: radial-gradient(
    ellipse at top,
    #fff5df,
    #e9d4ac 55%,
    #d2b17b
  );
}

h1 {
  font-size: clamp(25px, 5vw, 38px);
  margin: 4px 0 6px;
  letter-spacing: 3px;
}

.subtitle {
  margin-bottom: 16px;
  color: #755737;
  font-family: sans-serif;
  font-size: 14px;
}

.layout {
  display: flex;
  gap: 22px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
}

.game {
  width: min(94vw, 550px);
}

.board-frame {
  padding: 10px;
  background: linear-gradient(135deg, #f1d49a, #d5a75d);
  border: 5px solid #6b421e;
  border-radius: 12px;
  box-shadow: 0 12px 28px #54330e55;
}

#board {
  width: 100%;
  aspect-ratio: 9 / 10;
  position: relative;
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  grid-template-rows: repeat(10, minmax(0, 1fr));
  background: #edcc8c;
  border: 1px solid #8b5c2e;
  isolation: isolate;
}

.cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
}

.cell::before {
  content: "";
  position: absolute;
  inset: 0;
  border-right: 1px solid #81552f;
  border-bottom: 1px solid #81552f;
  pointer-events: none;
}

.cell:nth-child(9n + 1)::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid #81552f;
  pointer-events: none;
}

.cell.river::before {
  border-right: none;
}

.river-label {
  position: absolute;
  left: 0;
  right: 0;
  top: 40%;
  height: 10%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  pointer-events: none;
  z-index: 1;
  color: #80582f;
  font-weight: bold;
  letter-spacing: 4px;
  font-size: clamp(13px, 3vw, 22px);
}

.palace {
  position: absolute;
  z-index: 1;
  left: 33.333%;
  width: 33.333%;
  height: 20%;
  pointer-events: none;
}

.palace.top {
  top: 0;
}

.palace.bottom {
  bottom: 0;
}

.palace svg {
  width: 100%;
  height: 100%;
}

.palace line {
  stroke: #81552f;
  stroke-width: 1;
}

.piece {
  position: relative;
  z-index: 3;
  width: 86%;
  height: 86%;
  max-width: 48px;
  max-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: clamp(16px, 4vw, 29px);
  font-weight: bold;
  line-height: 1;
  background: radial-gradient(
    circle at 32% 25%,
    #fffbe8,
    #f5e4bb 52%,
    #d5b77e
  );
  border: 2px solid currentColor;
  box-shadow: 0 2px 3px #5d3b1e88;
  user-select: none;
}

.piece.red {
  color: var(--red);
}

.piece.black {
  color: var(--black);
}

.cell.selected .piece {
  background: #fff78b;
  outline: 3px solid #3d9ed8;
}

.cell.target::after {
  content: "";
  position: absolute;
  z-index: 4;
  width: 23%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #228b49cc;
  pointer-events: none;
}

.cell.capture::after {
  width: 82%;
  background: transparent;
  border: 3px dashed #d82e28;
}

.cell.last::before {
  background: #ffe75d44;
}

.side {
  width: min(94vw, 290px);
  text-align: left;
  padding: 16px;
  border: 1px solid #b58a51;
  border-radius: 12px;
  background: #fff8e9;
  font-family: sans-serif;
}

.status {
  padding: 12px;
  border-radius: 8px;
  background: #f4e2bd;
  font-weight: 800;
  text-align: center;
  font-size: 17px;
  margin-bottom: 12px;
}

.status.check {
  background: #ffe0d7;
  color: #a31d16;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0 14px;
}

button,
select {
  font: inherit;
  border-radius: 7px;
  padding: 10px;
  border: 1px solid #9a6b37;
}

button {
  cursor: pointer;
  font-weight: bold;
  background: #74451f;
  color: white;
}

button:hover {
  background: #925e2e;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

label {
  display: block;
  font-size: 13px;
  margin: 12px 0 5px;
}

select {
  width: 100%;
  background: #fff8e9;
}

.note {
  font-size: 13px;
  line-height: 1.65;
  color: #765c40;
}

#message {
  min-height: 42px;
  font-size: 14px;
  line-height: 1.5;
  margin: 12px 2px;
}

#history {
  max-height: 150px;
  overflow: auto;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
}

@media (max-width: 650px) {
  body {
    padding: 14px 6px;
  }

  .game {
    width: min(96vw, 520px);
  }

  .board-frame {
    padding: 7px;
    border-width: 3px;
  }

  .side {
    width: min(96vw, 520px);
  }

  .layout {
    gap: 12px;
  }
}
</style>
</head>

<body>

<h1>🏮 中國象棋</h1>
<p class="subtitle">楚河漢界・人機對弈</p>

<div class="layout">

  <main class="game">
    <div class="board-frame">
      <div id="board">

        <div class="palace top">
          <svg viewBox="0 0 100 100">
            <line x1="0" y1="0" x2="100" y2="100"/>
            <line x1="100" y1="0" x2="0" y2="100"/>
          </svg>
        </div>

        <div class="palace bottom">
          <svg viewBox="0 0 100 100">
            <line x1="0" y1="0" x2="100" y2="100"/>
            <line x1="100" y1="0" x2="0" y2="100"/>
          </svg>
        </div>

        <div class="river-label">
          <span>楚　河</span>
          <span>漢　界</span>
        </div>

      </div>
    </div>

    <div id="message">
      紅方先行。點擊棋子，再點擊合法位置。
    </div>
  </main>

  <aside class="side">

    <div id="status" class="status">紅方先行</div>

    <label for="difficulty">電腦難度</label>
    <select id="difficulty">
      <option value="1">入門</option>
      <option value="2" selected>普通</option>
      <option value="3">進階</option>
    </select>

    <label for="humanSide">選擇你要執的棋</label>
    <select id="humanSide">
      <option value="red">紅方（先行）</option>
      <option value="black">黑方（後行）</option>
    </select>

    <div class="controls">
      <button id="newGame">重新開始</button>
      <button id="undo">悔棋</button>
    </div>

    <div class="controls">
      <button id="flip">翻轉棋盤</button>
      <button id="hint">提示走法</button>
    </div>

    <p class="note">
      棋子必須遵守基本象棋走法。
      不能讓己方將帥受到攻擊。
      將帥不能照面。
      沒有合法走法時判定將死或困斃。
      三次重複局面會判和。
    </p>

    <label>走棋紀錄</label>
    <div id="history">尚未走棋</div>

  </aside>
</div>

<script>
"use strict";

const RED = "red";
const BLACK = "black";

const NAMES = {
  K:"帥", A:"仕", E:"相", R:"俥",
  H:"傌", C:"炮", P:"兵",
  k:"將", a:"士", e:"象", r:"車",
  h:"馬", c:"砲", p:"卒"
};

const VALUES = {
  k:10000, r:900, c:450,
  h:400, e:200, a:200, p:100
};

let board = [];
let turn = RED;
let human = RED;
let selected = null;
let legalMoves = [];
let history = [];
let gameOver = false;
let thinking = false;
let flipped = false;
let lastMove = null;
let moveText = [];
let positionCounts = new Map();
let hintMove = null;

const $ = id => document.getElementById(id);

function cloneBoard(b = board) {
  return b.map(row =>
    row.map(p => p ? {...p} : null)
  );
}

function initialBoard() {
  const b = Array.from(
    {length:10},
    () => Array(9).fill(null)
  );

  const back = ["r","h","e","a","k","a","e","h","r"];

  for (let c = 0; c < 9; c++) {
    b[0][c] = {type:back[c], color:BLACK};
    b[9][c] = {
      type:back[c].toUpperCase(),
      color:RED
    };
  }

  b[2][1] = {type:"c", color:BLACK};
  b[2][7] = {type:"c", color:BLACK};
  b[7][1] = {type:"C", color:RED};
  b[7][7] = {type:"C", color:RED};

  for (const c of [0,2,4,6,8]) {
    b[3][c] = {type:"p", color:BLACK};
    b[6][c] = {type:"P", color:RED};
  }

  return b;
}

function inside(r,c) {
  return r >= 0 && r < 10 && c >= 0 && c < 9;
}

function palace(r,c,color) {
  return c >= 3 && c <= 5 &&
    (color === RED
      ? r >= 7 && r <= 9
      : r >= 0 && r <= 2);
}

function sameSide(a,b) {
  return !!a && !!b && a.color === b.color;
}

function pathCount(r1,c1,r2,c2) {
  let n = 0;

  if (r1 === r2) {
    const step = Math.sign(c2-c1);
    for (let c=c1+step; c!==c2; c+=step) {
      if (board[r1][c]) n++;
    }
  } else if (c1 === c2) {
    const step = Math.sign(r2-r1);
    for (let r=r1+step; r!==r2; r+=step) {
      if (board[r][c1]) n++;
    }
  } else {
    return -1;
  }

  return n;
}

function pseudoMove(r1,c1,r2,c2) {
  if (!inside(r1,c1) || !inside(r2,c2)) return false;
  if (r1 === r2 && c1 === c2) return false;

  const p = board[r1][c1];
  const target = board[r2][c2];

  if (!p || sameSide(p,target)) return false;

  const type = p.type.toLowerCase();
  const dr = r2-r1;
  const dc = c2-c1;
  const ar = Math.abs(dr);
  const ac = Math.abs(dc);
  const forward = p.color === RED ? -1 : 1;

  // 車
  if (type === "r") {
    return (dr === 0 || dc === 0) &&
      pathCount(r1,c1,r2,c2) === 0;
  }

  // 炮
  if (type === "c") {
    if (dr !== 0 && dc !== 0) return false;
    const screens = pathCount(r1,c1,r2,c2);
    return target ? screens === 1 : screens === 0;
  }

  // 馬：檢查蹩馬腿
  if (type === "h") {
    if (!(
      (ar === 2 && ac === 1) ||
      (ar === 1 && ac === 2)
    )) return false;

    if (ar === 2) {
      return !board[r1 + Math.sign(dr)][c1];
    }

    return !board[r1][c1 + Math.sign(dc)];
  }

  // 相、象：檢查塞象眼及河界
  if (type === "e") {
    if (ar !== 2 || ac !== 2) return false;
    if (board[r1+dr/2][c1+dc/2]) return false;

    return p.color === RED ? r2 >= 5 : r2 <= 4;
  }

  // 士、仕
  if (type === "a") {
    return ar === 1 && ac === 1 &&
      palace(r2,c2,p.color);
  }

  // 將、帥
  if (type === "k") {
    // 將帥可以沿同一直線吃掉對方將帥
    if (
      c1 === c2 &&
      target &&
      target.type.toLowerCase() === "k" &&
      pathCount(r1,c1,r2,c2) === 0
    ) {
      return true;
    }

    return ar + ac === 1 &&
      palace(r2,c2,p.color);
  }

  // 兵、卒
  if (type === "p") {
    if (dc === 0 && dr === forward) return true;

    const crossed = p.color === RED
      ? r1 <= 4
      : r1 >= 5;

    return crossed && dr === 0 && ac === 1;
  }

  return false;
}

function findKing(color) {
  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      const p = board[r][c];

      if (
        p &&
        p.color === color &&
        p.type.toLowerCase() === "k"
      ) return [r,c];
    }
  }

  return null;
}

function inCheck(color) {
  const king = findKing(color);

  if (!king) return true;

  const [kr,kc] = king;
  const other = findKing(color === RED ? BLACK : RED);

  // 將帥照面
  if (
    other &&
    other[1] === kc &&
    pathCount(kr,kc,other[0],other[1]) === 0
  ) return true;

  // 檢查對方棋子是否攻擊己方將帥
  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      const p = board[r][c];

      if (
        p &&
        p.color !== color &&
        pseudoMove(r,c,kr,kc)
      ) return true;
    }
  }

  return false;
}

function legalMove(r1,c1,r2,c2) {
  if (!pseudoMove(r1,c1,r2,c2)) return false;

  const moving = board[r1][c1];
  const captured = board[r2][c2];

  board[r2][c2] = moving;
  board[r1][c1] = null;

  const safe = !inCheck(moving.color);

  board[r1][c1] = moving;
  board[r2][c2] = captured;

  return safe;
}

function getMoves(r,c) {
  if (!board[r][c]) return [];

  const moves = [];

  for (let r2=0; r2<10; r2++) {
    for (let c2=0; c2<9; c2++) {
      if (legalMove(r,c,r2,c2)) {
        moves.push([r2,c2]);
      }
    }
  }

  return moves;
}

function allMoves(color) {
  const out = [];

  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      const p = board[r][c];

      if (p && p.color === color) {
        for (const [r2,c2] of getMoves(r,c)) {
          out.push({
            from:[r,c],
            to:[r2,c2],
            piece:p,
            captured:board[r2][c2]
          });
        }
      }
    }
  }

  return out;
}

function keyPosition() {
  return board.map(row =>
    row.map(p => {
      if (!p) return ".";
      return p.color === RED
        ? p.type.toUpperCase()
        : p.type;
    }).join("")
  ).join("/") + ":" + turn;
}

function pushPosition() {
  const key = keyPosition();
  const count = (positionCounts.get(key) || 0) + 1;
  positionCounts.set(key,count);
  return count;
}

function makeMove(m,record=true) {
  const [r1,c1] = m.from;
  const [r2,c2] = m.to;

  const piece = board[r1][c1];
  const captured = board[r2][c2];

  if (record) {
    history.push({
      board:cloneBoard(),
      turn,
      lastMove:lastMove
        ? JSON.parse(JSON.stringify(lastMove))
        : null,
      moveText:moveText.slice(),
      positionCounts:new Map(positionCounts),
      gameOver
    });
  }

  board[r2][c2] = piece;
  board[r1][c1] = null;

  lastMove = {
    from:[r1,c1],
    to:[r2,c2]
  };

  moveText.push(
    `${moveText.length+1}. ` +
    `${piece.color===RED?"紅":"黑"}${NAMES[piece.type]} ` +
    `${coord(r1,c1)} → ${coord(r2,c2)}` +
    `${captured?" 吃子":""}`
  );

  turn = turn === RED ? BLACK : RED;
  selected = null;
  legalMoves = [];
  hintMove = null;

  const repetitions = pushPosition();

  if (captured && captured.type.toLowerCase() === "k") {
    gameOver = true;
    setMessage(
      (piece.color===RED?"紅方":"黑方") +
      "吃掉對方將帥，獲勝！"
    );
  } else if (repetitions >= 3) {
    gameOver = true;
    setMessage("同一局面出現三次，判和。");
  } else if (!hasAnyMove(turn)) {
    gameOver = true;

    if (inCheck(turn)) {
      setMessage(
        (turn===RED?"紅方":"黑方") +
        "被將死！" +
        (piece.color===RED?"紅方":"黑方") +
        "獲勝。"
      );
    } else {
      setMessage(
        (turn===RED?"紅方":"黑方") +
        "困斃，" +
        (piece.color===RED?"紅方":"黑方") +
        "獲勝。"
      );
    }
  } else {
    setMessage("走棋成功！");
  }

  render();
}

function coord(r,c) {
  return String.fromCharCode(65+c) + (10-r);
}

function setMessage(text) {
  $("message").textContent = text;
}

function render() {
  const el = $("board");

  el.querySelectorAll(".cell").forEach(n => n.remove());

  for (let vr=0; vr<10; vr++) {
    for (let vc=0; vc<9; vc++) {
      const r = flipped ? 9-vr : vr;
      const c = flipped ? 8-vc : vc;

      const cell = document.createElement("div");

      cell.className = "cell";
      if (r === 4) cell.classList.add("river");

      if (
        selected &&
        selected[0]===r &&
        selected[1]===c
      ) cell.classList.add("selected");

      if (
        lastMove &&
        (
          (lastMove.from[0]===r && lastMove.from[1]===c) ||
          (lastMove.to[0]===r && lastMove.to[1]===c)
        )
      ) cell.classList.add("last");

      if (
        legalMoves.some(m => m[0]===r && m[1]===c)
      ) {
        cell.classList.add("target");
        if (board[r][c]) cell.classList.add("capture");
      }

      if (
        hintMove &&
        (
          (hintMove.from[0]===r && hintMove.from[1]===c) ||
          (hintMove.to[0]===r && hintMove.to[1]===c)
        )
      ) cell.classList.add("last");

      const p = board[r][c];

      if (p) {
        const piece = document.createElement("div");
        piece.className = "piece " + p.color;
        piece.textContent = NAMES[p.type];
        cell.appendChild(piece);
      }

      cell.addEventListener(
        "click",
        () => clickCell(r,c)
      );

      el.appendChild(cell);
    }
  }

  const status = $("status");
  status.classList.toggle(
    "check",
    !gameOver && inCheck(turn)
  );

  if (gameOver) {
    status.textContent = "對局結束";
    $("history").textContent =
      moveText.length ? moveText.slice(-30).join("\n") : "尚未走棋";
    return;
  }

  status.textContent =
    (turn===human ? "輪到你" : "電腦思考中") +
    (inCheck(turn) ? "｜將軍！" : "");

  $("history").textContent =
    moveText.length
      ? moveText.slice(-30).join("\n")
      : "尚未走棋";
}

function clickCell(r,c) {
  if (gameOver || thinking || turn !== human) return;

  const p = board[r][c];

  if (selected) {
    const [r1,c1] = selected;

    const found = legalMoves.some(
      m => m[0]===r && m[1]===c
    );

    if (found) {
      makeMove({
        from:[r1,c1],
        to:[r,c]
      });

      if (!gameOver && turn !== human) {
        window.setTimeout(aiTurn,120);
      }

      return;
    }

    if (p && p.color === human) {
      selected = [r,c];
      legalMoves = getMoves(r,c);
    } else {
      selected = null;
      legalMoves = [];
    }
  } else if (p && p.color === human) {
    selected = [r,c];
    legalMoves = getMoves(r,c);
  }

  render();
}

// 棋子價值評估
function evaluate(color) {
  let score = 0;

  for (let r=0; r<10; r++) {
    for (let c=0; c<9; c++) {
      const p = board[r][c];
      if (!p) continue;

      const type = p.type.toLowerCase();
      let value = VALUES[type] || 0;

      if (type === "p") {
        const advance = p.color===RED ? 9-r : r;
        value += advance * 8;

        if (p.color===RED ? r<=4 : r>=5) {
          value += 35;
        }
      }

      if (["h","c","r"].includes(type)) {
        value += (4-Math.abs(4-c))*4;
      }

      score += p.color===color ? value : -value;
    }
  }

  if (inCheck(color)) score -= 35;

  if (inCheck(color===RED?BLACK:RED)) {
    score += 35;
  }

  return score;
}

function orderMoves(moves) {
  return moves.sort((a,b) => {
    const va = a.captured
      ? (VALUES[a.captured.type.toLowerCase()]||0)*10 -
        (VALUES[a.piece.type.toLowerCase()]||0)
      : 0;

    const vb = b.captured
      ? (VALUES[b.captured.type.toLowerCase()]||0)*10 -
        (VALUES[b.piece.type.toLowerCase()]||0)
      : 0;

    return vb-va;
  });
}

// Alpha-beta 搜尋
function search(depth,alpha,beta,maxColor,ply=0) {
  if (depth === 0) return evaluate(maxColor);

  const moves = orderMoves(allMoves(turn));

  if (!moves.length) {
    if (inCheck(turn)) {
      return turn===maxColor
        ? -100000+ply
        : 100000-ply;
    }

    return turn===maxColor
      ? -50000+ply
      : 50000-ply;
  }

  const maximizing = turn === maxColor;
  let best = maximizing ? -Infinity : Infinity;

  for (const m of moves) {
    const oldTurn = turn;
    const oldBoard = cloneBoard();

    board[m.to[0]][m.to[1]] =
      board[m.from[0]][m.from[1]];

    board[m.from[0]][m.from[1]] = null;

    turn = turn===RED ? BLACK : RED;

    const value = search(
      depth-1,alpha,beta,maxColor,ply+1
    );

    board = oldBoard;
    turn = oldTurn;

    if (maximizing) {
      best = Math.max(best,value);
      alpha = Math.max(alpha,best);
    } else {
      best = Math.min(best,value);
      beta = Math.min(beta,best);
    }

    if (beta <= alpha) break;
  }

  return best;
}

function chooseAIMove() {
  const level = Number($("difficulty").value);
  const depth = level===1 ? 1 : level===2 ? 2 : 3;

  const moves = orderMoves(allMoves(turn));
  if (!moves.length) return null;

  let best = -Infinity;
  let candidates = [];

  for (const m of moves) {
    const oldBoard = cloneBoard();
    const oldTurn = turn;

    board[m.to[0]][m.to[1]] =
      board[m.from[0]][m.from[1]];

    board[m.from[0]][m.from[1]] = null;

    turn = turn===RED ? BLACK : RED;

    const score = search(
      depth-1,-Infinity,Infinity,oldTurn,1
    );

    board = oldBoard;
    turn = oldTurn;

    if (score > best) {
      best = score;
      candidates = [m];
    } else if (score === best) {
      candidates.push(m);
    }
  }

  return candidates[
    Math.floor(Math.random()*candidates.length)
  ];
}

function aiTurn() {
  if (gameOver || turn === human) return;

  thinking = true;
  $("newGame").disabled = true;
  $("undo").disabled = true;

  render();

  window.setTimeout(() => {
    try {
      const move = chooseAIMove();

      if (move) {
        makeMove(move);
      } else {
        gameOver = true;
        setMessage("電腦沒有合法走法。");
        render();
      }
    } finally {
      thinking = false;
      $("newGame").disabled = false;
      $("undo").disabled = false;
      render();
    }
  },30);
}

function newGame() {
  human = $("humanSide").value;
  board = initialBoard();
  turn = RED;
  selected = null;
  legalMoves = [];
  history = [];
  gameOver = false;
  thinking = false;
  lastMove = null;
  moveText = [];
  positionCounts = new Map();
  hintMove = null;

  pushPosition();

  flipped = human === BLACK;

  setMessage(
    human===RED
      ? "新對局開始，你執紅方，請先行。"
      : "新對局開始，你執黑方，電腦紅方先行。"
  );

  render();

  if (turn !== human) {
    window.setTimeout(aiTurn,180);
  }
}

function undo() {
  if (thinking) return;

  if (!history.length) {
    setMessage("目前沒有可悔棋的步數。");
    return;
  }

  // 一般人機對弈會一起撤回雙方最近各一步
  let count = turn===human ? 2 : 1;

  while (count-- > 0 && history.length) {
    const h = history.pop();

    board = h.board;
    turn = h.turn;
    lastMove = h.lastMove;
    moveText = h.moveText;
    positionCounts = h.positionCounts;
    gameOver = h.gameOver;
  }

  selected = null;
  legalMoves = [];
  hintMove = null;

  setMessage("已悔棋。");
  render();
}

function hint() {
  if (gameOver || thinking || turn !== human) return;

  const moves = allMoves(human);

  if (!moves.length) {
    setMessage("目前沒有合法走法。");
    return;
  }

  let best = -Infinity;
  let bestMove = moves[0];

  for (const m of moves) {
    const oldBoard = cloneBoard();

    board[m.to[0]][m.to[1]] =
      board[m.from[0]][m.from[1]];

    board[m.from[0]][m.from[1]] = null;

    const score =
      evaluate(human) +
      (m.captured
        ? (VALUES[m.captured.type.toLowerCase()]||0)*0.7
        : 0);

    board = oldBoard;

    if (score > best) {
      best = score;
      bestMove = m;
    }
  }

  hintMove = bestMove;

  setMessage(
    `提示：${NAMES[bestMove.piece.type]} ` +
    `${coord(...bestMove.from)} → ${coord(...bestMove.to)}`
  );

  render();
}

$("newGame").addEventListener("click",newGame);
$("undo").addEventListener("click",undo);

$("flip").addEventListener("click",() => {
  flipped = !flipped;
  render();
});

$("hint").addEventListener("click",hint);

$("humanSide").addEventListener(
  "change",
  newGame
);

$("difficulty").addEventListener(
  "change",
  () => setMessage("已更新電腦難度。")
);

newGame();
</script>
